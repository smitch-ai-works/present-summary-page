<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  :root {
    color-scheme: light;
    --paper: #f4eddf; --card: #fffaf1; --ink: #1e2e26;
    --subtle: #555c50; --line: #dcd0b9; --green: #224938;
    --mint: #e6e8db; --gold: #d4ad70; --feature: #142d23;
    --cream: #fff7e6; --on-dark: #dedac7;
    --serif: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif CJK JP", "Meiryo", serif;
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    font-synthesis: none;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: var(--paper); }
  h1, h2, h3, p { margin: 0; }
  img { display: block; width: 100%; height: 100%; object-fit: cover; }
  a { color: inherit; text-decoration: none; }
  button, input { color: inherit; font: inherit; }
  button { cursor: pointer; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #197756; outline-offset: 3px; }
  [hidden] { display: none !important; }
  .shell { width: min(100% - 36px, 960px); margin-inline: auto; }

  .site-header { background: #142b22; color: var(--cream); border-bottom: 1px solid #d4ad7033; }
  .site-header .shell { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 65px; }
  .profile { display: inline-flex; align-items: center; gap: 9px; min-width: 0; }
  .profile img { flex: 0 0 42px; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--gold); }
  .profile strong, .profile span { display: block; }
  .profile strong { font-size: 14px; line-height: 1.25; word-break: auto-phrase; }
  .profile span { color: var(--on-dark); font-size: 11px; margin-top: 3px; }
  .jump { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 12px; font-weight: 750; color: #efcf99; white-space: nowrap; }
  .jump span { font-size: 15px; }

  .showcase {
    background: radial-gradient(ellipse at 80% 3%, #364c39, transparent 58%), var(--feature);
    color: var(--cream);
    border-bottom: 1px solid #c0a171;
  }
  .site-header a:focus-visible, .showcase a:focus-visible { outline-color: var(--gold); }
  .recent { padding-block: 19px 20px; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 11px; margin-bottom: 12px; }
  h1, h2 { font-family: var(--serif); font-weight: 700; letter-spacing: -.035em; }
  h1 { font-size: clamp(28px, 7vw, 42px); line-height: 1.22; }
  h2 { font-size: clamp(20px, 5vw, 28px); line-height: 1.3; }
  .section-head::after { content: ""; flex: 1; align-self: center; height: 1px; background: var(--line); }
  .showcase .section-head::after { background: #d4ad7055; }
  .section-head time, .section-head .count { order: 1; font-size: 12px; white-space: nowrap; }
  .section-head time { color: #efcf99; }
  .section-head .count { color: var(--subtle); }

  .recent-grid { display: grid; gap: 8px; }
  .featured {
    display: grid; overflow: hidden; isolation: isolate;
    border: 1px solid #c1a376; border-radius: 13px;
    background: #203b2e; box-shadow: 0 10px 24px #0a1c1650;
  }
  .featured-image { position: relative; display: block; aspect-ratio: 2.10; overflow: hidden; background: #233b2f; }
  .featured-image::after {
    content: ""; position: absolute; inset: 50% 0 0; pointer-events: none;
    background: linear-gradient(transparent, #203b2e);
  }
  .featured-image img { object-position: center 44%; }
  .featured-copy { position: relative; padding: 0 14px 14px; margin-top: -6px; }
  .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 7px; font-size: 11px; line-height: 1.35; color: var(--subtle); }
  .showcase .meta { color: var(--on-dark); }
  .new { display: inline-flex; align-items: center; justify-content: center; min-height: 19px; padding: 1px 6px; border-radius: 4px; background: #e9d3a4; color: #3d2e1c; font: 800 10px/1.15 system-ui,sans-serif; letter-spacing: .05em; }
  .featured h2 { font-size: clamp(20px, 5.2vw, 30px); line-height: 1.32; margin-block: 6px 5px; word-break: auto-phrase; text-wrap: pretty; }
  .featured p { color: var(--on-dark); font-size: 13px; line-height: 1.6; text-wrap: pretty; }
  .featured-cta { display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 8px 12px; margin-top: 11px; border-radius: 6px; background: #ead4a5; color: #223126; font-size: 13px; font-weight: 800; }
  .featured:active .featured-cta, .featured:focus-visible .featured-cta { background: #fff0cc; }
  .arrow { font: 500 17px/1 system-ui,sans-serif; }

  .recent-small, .catalog-item { min-width: 0; display: grid; grid-template-columns: 64px minmax(0,1fr) 17px; align-items: center; gap: 10px; padding: 8px 10px; }
  .recent-small { border: 1px solid #d4ad7045; border-radius: 8px; background: #fff9e908; }
  .recent-small .cover, .catalog-item .cover { display: block; overflow: hidden; height: 64px; border-radius: 4px; background: var(--mint); }
  .recent-small h2, .catalog-item h3 { font: 800 14px/1.36 "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; letter-spacing: -.025em; margin: 3px 0 2px; overflow-wrap: anywhere; word-break: auto-phrase; text-wrap: pretty; }
  .recent-small p, .catalog-item p { font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
  .recent-small p { color: var(--on-dark); }
  .recent-small .arrow { color: #efcf99; }
  .recent-small:active { border-color: #d4ad70; }

  .catalog { padding-top: 23px; scroll-margin-top: 14px; }
  .search { position: relative; display: block; }
  .search::before { content: ""; position: absolute; pointer-events: none; top: 15px; left: 14px; width: 12px; height: 12px; border: 1.7px solid var(--green); border-radius: 50%; }
  .search::after { content: ""; position: absolute; pointer-events: none; top: 26px; left: 24px; width: 7px; height: 1.7px; background: var(--green); transform: rotate(45deg); transform-origin: left; }
  .search input { display: block; width: 100%; min-height: 46px; padding: 9px 12px 9px 38px; border: 1px solid #c6b79b; border-radius: 7px; background: var(--card); font-size: 16px; }
  .search input::placeholder { color: #5b6c60; font-size: 13px; }
  .filter-set { display: flex; flex-wrap: wrap; gap: 4px; margin-block: 7px 10px; }
  .filter { min-height: 44px; padding: 5px 10px; border: 0; border-radius: 6px; background: transparent; font-size: 12px; font-weight: 750; }
  .filter[aria-pressed="true"] { color: white; background: var(--green); }
  .results { display: grid; border-block-start: 1px solid var(--line); }
  .results:empty { border-block-start: 0; }
  .catalog-item { grid-template-columns: 82px minmax(0,1fr) 17px; align-items: start; min-height: 101px; padding: 11px 4px; border-bottom: 1px solid var(--line); }
  .catalog-item .cover { height: 67px; margin-top: 2px; }
  .catalog-item .arrow { align-self: center; color: var(--green); }
  .catalog-item p { color: var(--subtle); }
  .catalog-item:active, .filter:active { background: #e7e5d6; }
  .filter[aria-pressed="true"]:active { background: var(--green); }
  .empty { border: 1px dashed #a9b9ab; padding: 15px; font-size: 14px; line-height: 1.65; border-radius: 9px; }

  .footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 28px; margin-bottom: 24px; padding-top: 14px; color: var(--subtle); font-size: 12px; }
  .footer a { color: var(--green); text-decoration: underline; text-underline-offset: 3px; }
  @media (hover: hover) {
    .featured:hover .featured-cta { background: #fff0cc; }
    .recent-small:hover { border-color: #d4ad70; background: #fff9e910; }
    .catalog-item:hover { background: #fff9ed; }
    .filter:not([aria-pressed="true"]):hover { background: var(--mint); }
  }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
    .featured-image img { animation: cover-arrive 780ms cubic-bezier(.19,.65,.2,1) both; }
    .featured-cta { transition: background-color 180ms ease; }
    .featured-cta .arrow { transition: transform 180ms ease; }
    .featured:active .arrow, .featured:focus-visible .arrow { transform: translateX(3px); }
    @media (hover: hover) {
      .featured:hover .arrow { transform: translateX(3px); }
    }
  }
  @keyframes cover-arrive {
    from { clip-path: inset(0 0 18% 0); opacity: .64; transform: scale(1.085); }
    to { clip-path: inset(0); opacity: 1; transform: scale(1); }
  }
  @media (max-width: 350px) {
    .shell { width: calc(100% - 28px); }
    .search input::placeholder { font-size: 12px; }
    .catalog-item { grid-template-columns: 67px minmax(0, 1fr) 14px; gap: 8px; }
    .catalog-item .cover { height: 61px; }
  }
  @media (min-width: 720px) {
    .site-header .shell { min-height: 72px; }
    .recent { padding-block: 26px 32px; }
    .section-head { margin-bottom: 14px; }
    .recent-grid { grid-template-columns: 1.55fr 1fr; grid-template-rows: 1fr 1fr; gap: 11px; }
    .featured { grid-row: span 2; }
    .featured-image { aspect-ratio: 2.32; }
    .featured-copy { padding: 0 19px 19px; }
    .featured-cta { margin-top: 14px; }
    .recent-small { grid-template-columns: 100px minmax(0,1fr) 18px; padding: 12px; gap: 12px; }
    .recent-small .cover { height: 100px; }
    .recent-small h2, .catalog-item h3 { font-size: 16px; }
    .recent-small p, .catalog-item p { font-size: 13px; }
    .catalog { padding-top: 31px; }
    .catalog-item { grid-template-columns: 122px minmax(0,1fr) 20px; align-items: center; min-height: 98px; padding: 10px 8px; column-gap: 15px; }
    .catalog-item .cover { height: 74px; margin: 0; }
  }
</style>
</head>

  const purposeOverrides = {
    "no6-ai-sticker": "副業・販売",
    "no14-chatgpt-picture-japan": "副業・販売",
    "no20-claude-code-ai-note-organization": "AI活用",
    "no21-chatgpt-canva-slide": "作品づくり",
    "no24-claude-code-luxury-site": "作品づくり",
    "no25-chatgpt-sites-templates": "作品づくり",
    "no33-cat-tshirt": "作品づくり",
    "no45-note-codex-workflow": "作品づくり",
    "no56-chatgpt-bookmark-workflow": "作品づくり",
    "no58-ai-tools-workflow": "AI活用",
    "no60-ai-note-practice": "作品づくり",
    "no55-ai-ehon-work-auto": "作品づくり",
    "no61-gemini-product-cm": "作品づくり",
    "no48-japanese-remote-work": "副業・販売",
    "no67-claude-video-editing": "作品づくり"
  };

  const contentsOverrides = {
    "no67-claude-video-editing": "縦型リールの編集手順と指示文6本。",
    "no62-claude-rakuten-selection": "商品比較の指示文と投稿テンプレート。",
    "no75-ai-first-product": "商品を決めるワークシートと、note・LINEスタンプ・LPの作例。"
  };

  function purposeFor(item) {
    if (Object.prototype.hasOwnProperty.call(purposeOverrides, item.slug)) return purposeOverrides[item.slug];
    if (item.category === 'AI副業') return '副業・販売';
    if (/制作|編集/.test(item.category)) return '作品づくり';
    return 'AI活用';
  }

  const items = bonuses.map(item => ({
    ...item,
    purpose: purposeFor(item),
    contents: contentsOverrides[item.slug] || item.description
  }));
  const sorted = [...items].sort((first, second) =>
    (second.publishedAt ?? 0) - (first.publishedAt ?? 0) || Number(second.number) - Number(first.number)
  );
  const search = document.getElementById('searchInput');
  const filterButtons = [...document.querySelectorAll('.filter')];
  const results = document.getElementById('cards');
  const empty = document.getElementById('empty');
  const resultCount = document.getElementById('resultCount');
  const allowMotion = matchMedia('(prefers-reduced-motion: no-preference)');
  const newDuration = 7 * 24 * 60 * 60 * 1000;
  const dateFormat = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', month: 'numeric', day: 'numeric' });
  let activePurpose = '';

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);
  }

  function newBadge(item, now) {
    if (!item.publishedAt || item.publishedAt > now || now - item.publishedAt >= newDuration) return '';
    return '<span class="new" aria-label="新着">NEW</span>';
  }

  function artwork(source, eager = false) {
    if (!source) return '';
    return '<img src="' + escapeHtml(source) + '" alt="" ' +
      (eager ? 'fetchpriority="high"' : 'loading="lazy"') + ' decoding="async">';
  }

  function linkStart(item, style) {
    return '<a class="' + style + '" href="' + escapeHtml(item.url) +
      '" target="_blank" rel="noopener noreferrer" aria-label="' + escapeHtml(item.plainTitle) + 'を受け取る">';
  }

  function recentCard(item, index, now) {
    const detail = index === 0 ? escapeHtml(item.purpose)
      : item.publishedAt ? dateFormat.format(item.publishedAt) + '追加' : '';
    const metadata = '<div class="meta">' + newBadge(item, now) +
      (detail ? '<span>' + detail + '</span>' : '') + '</div>';
    const contents = escapeHtml(item.contents);
    const title = escapeHtml(item.plainTitle);
    const arrow = '<span class="arrow" aria-hidden="true">→</span>';
    if (index === 0) {
      return linkStart(item, 'featured') +
        '<span class="featured-image">' + artwork(item.image, true) + '</span>' +
        '<div class="featured-copy">' + metadata + '<h2>' + title + '</h2><p>' + contents + '</p>' +
        '<span class="featured-cta">特典を受け取る ' + arrow + '</span></div></a>';
    }
    return linkStart(item, 'recent-small') + '<span class="cover">' + artwork(item.bonusCover || item.image) +
      '</span><div>' + metadata + '<h2>' + title + '</h2><p>' + contents + '</p></div>' + arrow + '</a>';
  }

  function listCard(item, now) {
    const number = item.number;
    return linkStart(item, 'catalog-item') + '<span class="cover">' + artwork(item.image) +
      '</span><div><div class="meta"><span>特典 ' + number + '</span><span aria-hidden="true">・</span>' +
      '<span>' + escapeHtml(item.purpose) + '</span>' + newBadge(item, now) + '</div><h3>' +
      escapeHtml(item.plainTitle) + '</h3><p>' + escapeHtml(item.contents) +
      '</p></div><span class="arrow" aria-hidden="true">→</span></a>';
  }

  function normalize(text) { return text.normalize('NFKC').toLowerCase().trim(); }

  function bonusNumberFromSearch(query) {
    const match = query.replace(/\s+/g, '').match(/^(?:特典)?(?:no\.?|番号|#)?0*(\d+)$/);
    if (!match) return null;
    const number = Number(match[1]);
    return /\D/.test(query.replace(/\s+/g, '')) || items.some(item => Number(item.number) === number) ? number : null;
  }

  function renderList() {
    const query = normalize(search.value);
    const number = bonusNumberFromSearch(query);
    const words = query.split(/\s+/).filter(Boolean);
    const matchingItems = sorted.filter(item => {
      if (activePurpose && item.purpose !== activePurpose) return false;
      if (number !== null) return Number(item.number) === number;
      const text = normalize([item.plainTitle, item.description, item.category, item.purpose, item.contents,
        item.sourceVideo, item.sourceVideo.replace(/\s+/g, ''), ...item.tags].join(' '));
      return words.every(word => text.includes(word));
    });
    const now = Date.now();
    results.innerHTML = matchingItems.map(item => listCard(item, now)).join('');
    resultCount.textContent = matchingItems.length + '件';
    empty.hidden = matchingItems.length > 0;
  }

  function setPurpose(purpose) {
    activePurpose = purpose;
    filterButtons.forEach(button => {
      button.setAttribute('aria-pressed', String(button.dataset.purpose === purpose));
    });
  }

  let filterAnimation;
  filterButtons.forEach(button => button.addEventListener('click', () => {
    if (activePurpose === button.dataset.purpose) return;
    setPurpose(button.dataset.purpose);
    renderList();
    filterAnimation?.cancel();
    if (allowMotion.matches && results.childElementCount) {
      filterAnimation = results.animate(
        [{ opacity: .38, transform: 'translateY(5px)' }, { opacity: 1, transform: 'translateY(0)' }],
        { duration: 230, easing: 'cubic-bezier(.2,.65,.25,1)' }
      );
    }
  }));
  search.addEventListener('input', () => {
    if (activePurpose && bonusNumberFromSearch(normalize(search.value)) !== null) {
      setPurpose('');
    }
    renderList();
  });

  const now = Date.now();
  const recentItems = sorted.slice(0, 3);
  document.getElementById('recent').innerHTML = recentItems.map((item, index) => recentCard(item, index, now)).join('');
  const lastPublication = recentItems[0]?.publishedAt;
  if (lastPublication) {
    const latestUpdate = document.getElementById('latest-update');
    latestUpdate.dateTime = new Date(lastPublication).toISOString();
    latestUpdate.textContent = dateFormat.format(lastPublication) + ' 更新';
    latestUpdate.hidden = false;
  }
  renderList();
</script>
