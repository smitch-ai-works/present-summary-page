name: Publish bonus 26 to the hub page

# 18:00 JST on 2026-08-26 == 09:00 UTC.
# The job is idempotent: once the card is on main it does nothing.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Skip if the card is already live
        id: gate
        run: |
          if grep -q 'no26-chatgpt-tshirt-suzuri' index.html; then
            echo "already published"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Take the queued content
        if: steps.gate.outputs.run == 'true'
        run: |
          git fetch origin queued-no26
          git checkout FETCH_HEAD -- index.html assets/preview-v2/no26.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/preview-v2/no26.jpg
          git commit -m "特典26（ChatGPTでTシャツを作って売る）をハブページに追加（14本目）"
          git push origin HEAD:main
